; Deck Link example: a 128x64 SSD1306 OLED and one button on a classic ESP32.
; The library comes from this kit (symlink://../..). In a copy under
; firmware/devices/<name>, use symlink://../../deck-link instead.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 6.8.1
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	symlink://../..
	adafruit/Adafruit SSD1306 @ ^2.5.13
	adafruit/Adafruit GFX Library @ ^1.12.1
	adafruit/Adafruit BusIO @ ^1.17.0
build_src_flags = -Wall -Wextra
