; Deck Link example: one RGB LED on an ESP32-C3 shows whether agents need you.
; The library comes from this kit (symlink://../..). In a copy under
; firmware/devices/<name>, use symlink://../../deck-link instead.

[platformio]
default_envs = esp32-c3-devkitm-1

[env]
platform = espressif32 @ 6.8.1
framework = arduino
monitor_speed = 115200
lib_deps = symlink://../..
build_src_flags = -Wall -Wextra

; ESP32-C3-DevKitM-1: USB through the on-board USB-UART bridge; RGB LED on GPIO8.
[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1

; C3 boards with only the native USB port (C3 SuperMini and similar).
[env:esp32-c3-native-usb]
board = esp32-c3-devkitm-1
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
