; Deck Link example: a rotary encoder with a push button on an ESP32-S3.
; Deck Link runs on the native USB port; a readable view goes to the UART
; port (Serial0), or to an optional SSD1306 in the -oled environment.
; The library comes from this kit (symlink://../..). In a copy under
; firmware/devices/<name>, use symlink://../../deck-link instead.

[platformio]
default_envs = esp32-s3-devkitc-1

[env]
platform = espressif32 @ 6.8.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_flags = -Wall -Wextra
; Serial = the native USB port (USB Serial/JTAG), Serial0 = the UART port.
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-s3-devkitc-1]
lib_deps = symlink://../..

[env:esp32-s3-devkitc-1-oled]
build_flags = ${env.build_flags} -DKNOB_OLED=1
lib_deps =
	symlink://../..
	adafruit/Adafruit SSD1306 @ ^2.5.13
	adafruit/Adafruit GFX Library @ ^1.12.1
	adafruit/Adafruit BusIO @ ^1.17.0
